[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocdi"
version = "0.1.0"
description = "Operator-guided generative reconstruction for SMS MRI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
  "matplotlib>=3.7",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["ocdi*"]
